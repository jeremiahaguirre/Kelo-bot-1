# Builds the Kelo-1 World Windows app (installer + portable .exe).
# Run it from the Actions tab ("Build Windows app" -> Run workflow) and download the files from
# the run's Artifacts, or push a tag like v1.0.0 to also publish them on a GitHub Release.
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Build installer and portable app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Kelo-1-World-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" dist/*.exe --title "Kelo-1 World ${GITHUB_REF_NAME}" --notes "Windows installer and portable app for Kelo-1 World."
