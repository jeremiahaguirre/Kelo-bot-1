# Builds the Kelo-1 World phone apps (Capacitor, see docs/MOBILE.md).
#
# Android: always a debug APK you can install on a phone. When the four ANDROID_* secrets are set,
#          also a signed release AAB, ready to upload to Google Play.
# iOS:     always an unsigned build, to check that the Xcode project compiles. When the IOS_* and
#          APPSTORE_* secrets are set and you run it by hand with "Upload to TestFlight" ticked, it
#          also signs the app and uploads it to App Store Connect (TestFlight).
#
# Run it from the Actions tab ("Build phone apps" -> Run workflow) and download the files from the
# run's Artifacts. No key or password is ever stored in the repo; they live only in GitHub secrets.
name: Build phone apps

on:
  workflow_dispatch:
    inputs:
      upload_ios:
        description: 'Upload to TestFlight (needs the IOS_* and APPSTORE_* secrets)'
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'scripts/build-web.mjs'
      - 'js/native.js'
      - 'css/native.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # The phone builds don't need Electron's 100 MB download
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      KELO_VERSION_CODE: ${{ github.run_number }}
      KELO_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install
        run: npm ci

      - name: Build the web files and copy them into the Android project
        run: npm run cap:sync

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kelo-1-World-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build the signed release bundle (AAB) for Google Play
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KELO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KELO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KELO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export KELO_KEYSTORE_FILE="$RUNNER_TEMP/kelo-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KELO_KEYSTORE_FILE"
          ./gradlew --no-daemon bundleRelease
          rm -f "$KELO_KEYSTORE_FILE"

      - name: Upload the release bundle
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kelo-1-World-Android-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_APPSTORE: ${{ secrets.IOS_TEAM_ID != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' && secrets.APPSTORE_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the web files and copy them into the iOS project
        run: npm run cap:sync

      - name: Build the app without signing (checks that it compiles)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive, sign and upload to TestFlight
        if: env.HAS_APPSTORE == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$API_ISSUER_ID")
          # Xcode's automatic signing makes the certificate and profile with the App Store Connect key
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kelo1.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kelo1.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
